name: Build and publish PDF
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: notes
      - name: Upload downloadable PDF
        uses: actions/upload-artifact@v4
        with:
          name: AEC-Categoricity-Notes
          path: notes/main.pdf
      - name: Prepare Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp notes/main.pdf _site/AEC-Categoricity-Notes.pdf
          cp notes/main.pdf _site/main.pdf
          printf '<!doctype html><html><head><meta charset="utf-8"><title>AEC categoricity notes</title></head><body><p><a href="AEC-Categoricity-Notes.pdf">Open the latest PDF</a></p></body></html>' > _site/index.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: latex
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
